name: Release to PyPI

# MANUAL ONLY. This workflow never runs automatically — it must be started by
# hand from the Actions tab ("Run workflow"). This prevents an ordinary tag
# push from accidentally attempting a publish.
#
# Uses PyPI Trusted Publishing (OIDC) — no API token is stored in the repo.
# Before the FIRST publish:
#   1. Create a PyPI account and reserve the project name `agent-keychain`.
#   2. PyPI -> your project -> Publishing -> Add a GitHub publisher:
#        Owner:        Co5m0sbip1nnatus
#        Repository:   agent-keychain
#        Workflow:     release.yml
#        Environment:  pypi
#   3. Then run this workflow manually, optionally entering the tag to release.
#
# (To switch back to automatic tag-triggered releases later, replace the
#  `workflow_dispatch` block below with:
#     on:
#       push:
#         tags: ["v*"]
#  Only do this once trusted publishing above is configured.)

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Git ref (tag or branch) to build and publish"
        required: false
        default: ""

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.ref }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade build twine
          python -m build
          python -m twine check dist/*

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write  # required for Trusted Publishing (OIDC)
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
