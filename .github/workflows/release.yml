name: Release to PyPI

# Publishes the package to PyPI when a version tag (e.g. v1.3.0) is pushed.
#
# Uses PyPI Trusted Publishing (OIDC) — no API token is stored in the repo.
# Before the first release, configure a trusted publisher on PyPI:
#   PyPI -> your project -> Publishing -> Add a GitHub publisher
#     Owner:        Co5m0sbip1nnatus
#     Repository:   agent-keychain
#     Workflow:     release.yml
#     Environment:  pypi
# (The project name `agent-keychain` must be registered/owned by your account.)

on:
  push:
    tags:
      - "v*"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade build twine
          python -m build
          python -m twine check dist/*

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write  # required for Trusted Publishing (OIDC)
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
