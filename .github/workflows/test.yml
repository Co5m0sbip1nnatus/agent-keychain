name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    env:
      # Headless Linux runners have no SecretService; the file backend runs
      # the same policy engine there (macOS exercises the real keychain).
      AGENT_KEYCHAIN_BACKEND: ${{ matrix.os == 'ubuntu-latest' && 'file' || 'keyring' }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m venv venv
          source venv/bin/activate
          pip install -r requirements.txt

      - name: Run test
        run: |
          source venv/bin/activate
          python -m pytest tests/ -v
